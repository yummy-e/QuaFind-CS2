
name: Build QuaFind

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'

          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (-not $vs) {
            throw "MSVC C++ Build Tools not found"
          }

          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'

          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found"
          }

          "vcvars=$vcvars" >> $env:GITHUB_OUTPUT

      - name: Compile QuaFind DLL
        shell: cmd
        working-directory: src
        run: |
          call "${{ steps.vs.outputs.vcvars }}"
          if errorlevel 1 exit /b 1

          cl.exe /nologo /EHa /MD /O2 /std:c++17 /W0 /LD ^
            dllmain.cpp ^
            imgui\imgui.cpp ^
            imgui\imgui_draw.cpp ^
            imgui\imgui_tables.cpp ^
            imgui\imgui_widgets.cpp ^
            imgui\imgui_impl_win32.cpp ^
            imgui\imgui_impl_dx11.cpp ^
            hook\src\buffer.c ^
            hook\src\hook.c ^
            hook\src\trampoline.c ^
            hook\src\hde\hde32.c ^
            hook\src\hde\hde64.c ^
            /Fe:QuaFind.dll ^
            /link /PDB:QuaFind.pdb ^
            user32.lib d3d11.lib dxgi.lib dwmapi.lib shell32.lib gdi32.lib ole32.lib windowscodecs.lib d3dcompiler.lib psapi.lib

          if errorlevel 1 exit /b 1
          if not exist QuaFind.dll exit /b 1

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: QuaFind-Compiled
          path: src/QuaFind.dll
          if-no-files-found: error
