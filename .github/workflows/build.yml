
name: Build QuaFind

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (-not $vs) {
            throw "Visual Studio C++ tools not found"
          }

          $file = "src/build.bat"
          $lines = Get-Content $file
          $lines[8] = "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul 2>&1"
          Set-Content $file $lines -Encoding ascii

      - name: Compile DLL
        shell: cmd
        run: |
          echo.| call src\build.bat
          if not exist "src\QuaFind.dll" exit /b 1

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: QuaFind-Compiled
          path: src/QuaFind.dll
